<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AQT 量化研究台</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/echarts.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4 17.5 9.2 12l3.4 3.1L20 6.5" />
              <path d="M4 4.5v15h16" />
            </svg>
          </div>
          <div>
            <h1>AQT</h1>
            <p>A 股量化研究台</p>
          </div>
        </div>

        <form id="settingsForm" class="settings-form">
          <section class="control-group">
            <h2>路径</h2>
            <label>
              数据目录
              <input name="data_dir" value="data/live" autocomplete="off" />
            </label>
            <label>
              输出目录
              <input name="out_dir" value="reports/demo" autocomplete="off" />
            </label>
            <label>
              持仓文件
              <input name="positions_file" value="" placeholder="可留空" autocomplete="off" />
            </label>
          </section>

          <section class="control-group">
            <h2>回测</h2>
            <div class="field-grid">
              <label>
                开始
                <input type="date" name="start" value="2023-07-03" />
              </label>
              <label>
                结束
                <input type="date" name="end" value="2024-12-31" />
              </label>
            </div>
            <label>
              初始资金
              <input type="number" name="cash" value="1000000" step="10000" />
            </label>
          </section>

          <section class="control-group">
            <h2>策略</h2>
            <label>
              策略类型
              <select name="strategy">
                <option value="multi_factor">多因子轮动</option>
                <option value="ma_crossover">均线交叉</option>
                <option value="breakout">通道突破</option>
                <option value="mean_reversion">均值回归</option>
              </select>
            </label>
            <div class="field-grid">
              <label>
                持仓数
                <input type="number" name="top_n" value="8" min="1" max="50" />
              </label>
              <label>
                单票上限
                <input type="number" name="max_weight" value="0.15" step="0.01" />
              </label>
            </div>
            <div class="field-grid">
              <label>
                现金缓冲
                <input type="number" name="cash_buffer" value="0.02" step="0.01" />
              </label>
              <label>
                最低成交额
                <input type="number" name="min_amount" value="20000000" step="1000000" />
              </label>
            </div>
            <label>
              调仓频率
              <select name="rebalance_freq">
                <option value="monthly">月度</option>
                <option value="weekly">周度</option>
                <option value="daily">日度</option>
              </select>
            </label>
            <div class="field-grid">
              <label>
                止损 (%)
                <input type="number" name="stop_loss" value="0" step="0.5" min="0" max="20" />
              </label>
              <label>
                止盈 (%)
                <input type="number" name="take_profit" value="0" step="0.5" min="0" max="50" />
              </label>
            </div>
            <label>
              移动止损 (%)
              <input type="number" name="trailing_stop" value="0" step="0.5" min="0" max="20" />
            </label>
            <label>
              单行业上限
              <input type="number" name="max_per_industry" value="0" min="0" max="20" />
            </label>
            <label>
              黑名单
              <input name="blacklist" value="" placeholder="逗号分隔，如 600008,000002" autocomplete="off" />
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="optimize" id="optimizeCheckbox" /> 参数扫描 (Grid Search)
            </label>
            <div id="optimizeSection" class="optimize-section" style="display:none">
              <label>
                Top-N 枚举
                <input name="opt_top_n" value="5,8,10,15" placeholder="逗号分隔" autocomplete="off" />
              </label>
              <label>
                回看天数枚举
                <input name="opt_lookback" value="30,60,90,120" placeholder="逗号分隔" autocomplete="off" />
              </label>
              <label>
                排名指标
                <select name="opt_metric">
                  <option value="sharpe_like">Sharpe-like</option>
                  <option value="total_return">总收益</option>
                  <option value="max_drawdown">最大回撤</option>
                </select>
              </label>
              <label>
                显示结果数
                <input type="number" name="opt_results" value="10" min="1" max="50" />
              </label>
            </div>
          </section>

          <section class="control-group">
            <h2>样例数据</h2>
            <div class="field-grid">
              <label>
                起始
                <input type="date" name="sample_start" value="2022-01-04" />
              </label>
              <label>
                截止
                <input type="date" name="sample_end" value="2024-12-31" />
              </label>
            </div>
          </section>
        </form>

        <div class="action-stack">
          <button id="initSampleButton" class="button secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            生成样例数据
          </button>
          <button id="fetchDataButton" class="button secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 3v6h-6" /></svg>
            拉取每日数据
          </button>
          <div class="fetch-init-row">
            <button id="fetchInitButton" class="button secondary" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /><circle cx="12" cy="12" r="10"/></svg>
              初始化数据
            </button>
            <span class="init-hint">当日行情 + 历史K线 + 基准 + 行业分类</span>
          </div>
          <div class="fetch-history-row">
            <input id="historyDaysInput" type="number" value="60" min="1" max="500"
                   class="history-days-input" title="历史数据天数" />
            <button id="fetchHistoryButton" class="button secondary" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v6l4 2" /><circle cx="12" cy="12" r="10"/></svg>
              拉取历史数据
            </button>
          </div>
          <button id="runBacktestButton" class="button primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 17 5-5 3 3 4-7" /><path d="M5 20h14" /></svg>
            运行回测
          </button>
          <button id="positionsTemplateButton" class="button secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            生成持仓模板
          </button>
          <div class="plan-asof-row">
            <label>计划日期 <input type="date" name="plan_as_of" /></label>
            <span class="hint">留空则用最新数据日期</span>
          </div>
          <button id="runPlanButton" class="button secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16H7z" /><path d="M9.5 8h5M9.5 12h5M9.5 16h3" /></svg>
            生成交易计划
          </button>
        </div>
      </aside>

      <main class="main">
        <div id="indexTicker" class="index-ticker">
          <div class="index-ticker-inner">
            <span class="index-item" data-code="000001">
              <strong>上证</strong> <span class="idx-price">--</span>
              <span class="idx-change">--</span>
            </span>
            <span class="index-item" data-code="399001">
              <strong>深证</strong> <span class="idx-price">--</span>
              <span class="idx-change">--</span>
            </span>
            <span class="index-item" data-code="000300">
              <strong>沪深300</strong> <span class="idx-price">--</span>
              <span class="idx-change">--</span>
            </span>
            <span class="index-item" data-code="399006">
              <strong>创业板</strong> <span class="idx-price">--</span>
              <span class="idx-change">--</span>
            </span>
          </div>
          <span id="marketTime" class="market-time">--</span>
        </div>

        <header class="topbar">
          <div>
            <h2>研究概览</h2>
            <p id="workspaceLabel">读取工作区状态...</p>
          </div>
          <div class="status-cluster">
            <span id="dataStatus" class="status-pill pending">数据未确认</span>
            <span id="reportStatus" class="status-pill pending">报告未确认</span>
          </div>
        </header>

        <section class="hero-panel">
          <div>
            <h3>多策略量化研究</h3>
            <p>日线研究、A 股交易规则模拟、实时行情看板、K 线分析与手动交易计划集中在一个本地界面。</p>
          </div>
          <div class="hero-rules">
            <span>T+1</span>
            <span>整百股</span>
            <span>涨跌停</span>
            <span>费用</span>
          </div>
        </section>

        <section id="kpiGrid" class="kpi-grid" aria-live="polite"></section>

        <section class="workspace-grid">
          <div class="panel chart-panel">
            <div class="panel-header">
              <div>
                <h3 id="chartTitle">K线图</h3>
                <p id="klineSymbolLabel">输入股票代码查看</p>
              </div>
              <div class="chart-controls">
                <div class="chart-toggle">
                  <button class="tab active" data-chart="kline" type="button">K线图</button>
                  <button class="tab" data-chart="equity" type="button">净值曲线</button>
                </div>
                <div class="kline-controls" id="klineControls">
                  <div class="period-toggle" id="periodToggle">
                    <button class="tab active" data-period="1d" type="button">日K</button>
                    <button class="tab" data-period="1w" type="button">周K</button>
                    <button class="tab" data-period="1M" type="button">月K</button>
                  </div>
                  <input id="klineDaysInput" type="number" value="60" min="5" max="500"
                         class="kline-days-input" title="显示天数" />
                  <input id="symbolSearch" type="text" class="symbol-search"
                         placeholder="输入代码 如 600000" maxlength="6"
                         autocomplete="off" />
                  <button id="searchButton" class="icon-button" type="button" title="查询">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                  </button>
                  <button id="addWatchlistButton" class="icon-button" type="button" title="加入自选">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </div>
                <button id="refreshButton" class="icon-button" type="button" title="刷新报告" style="display:none">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7" /><path d="M20 4v6h-6" /></svg>
                </button>
              </div>
            </div>
            <div id="klineChart" class="kline-container"></div>
            <canvas id="equityChart" width="900" height="360" style="display:none"></canvas>
          </div>

          <div class="panel files-panel">
            <div class="panel-header">
              <div>
                <h3>自选股</h3>
                <p id="watchlistCount">--</p>
              </div>
            </div>
            <div id="watchlistContainer" class="watchlist-items"></div>
            <hr class="panel-divider" />
            <div class="panel-header">
              <div>
                <h3>输出文件</h3>
                <p>本地生成结果</p>
              </div>
            </div>
            <div id="fileList" class="file-list"></div>
          </div>
        </section>

        <section class="panel table-panel">
          <div class="tabs" role="tablist" aria-label="数据视图">
            <button class="tab active" data-tab="trades" type="button">交易流水</button>
            <button class="tab" data-tab="plan" type="button">交易计划</button>
            <button class="tab" data-tab="watchlist" type="button">自选股</button>
            <button class="tab" data-tab="optimize" type="button">优化结果</button>
            <button class="tab" data-tab="summary" type="button">指标明细</button>
          </div>
          <div id="tabContent" class="tab-content"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
